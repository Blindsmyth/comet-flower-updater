[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zd2tools"
version = "0.1.0"
description = "Tooling for Zoom .ZD2 patch files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Gemini CLI Agent" },
]
dependencies = [
    "click>=8.1.7",
]

[project.scripts]
zd2 = "zd2tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zd2tools"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
